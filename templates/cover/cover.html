<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url("{{FONTS}}/Pretendard-Regular.woff2");font-weight:400}
@font-face{font-family:P;src:url("{{FONTS}}/Pretendard-Bold.woff2");font-weight:700}
@font-face{font-family:P;src:url("{{FONTS}}/Pretendard-ExtraBold.woff2");font-weight:800}
*{box-sizing:border-box;margin:0}
html,body{width:1536px;height:1024px}
body{font-family:P,'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;background:{{BG}};color:#1d2433;overflow:hidden;position:relative}
.band{position:absolute;inset:0 0 auto 0;height:14px;background:{{C}}}
.o1,.o2,.o3{position:absolute;border-radius:50%}
.o1{width:760px;height:760px;right:-200px;top:-180px;background:{{L}}}
.o2{width:300px;height:300px;right:250px;bottom:-110px;background:{{C}};opacity:.10}
.o3{width:120px;height:120px;right:130px;top:470px;border:16px solid {{C}};opacity:.25}
.num{position:absolute;right:120px;top:120px;font-size:250px;font-weight:800;color:{{C}};opacity:.16;letter-spacing:-.04em;line-height:1}
.wrap{position:absolute;left:110px;top:150px;right:520px}
.chip{display:inline-block;background:{{C}};color:#fff;font-weight:700;font-size:30px;border-radius:999px;padding:10px 26px}
.crumb{margin-top:36px;font-size:30px;color:#5b6270;font-weight:600}
h1{margin-top:22px;font-size:{{TSIZE}}px;line-height:1.22;font-weight:800;letter-spacing:-.03em;word-break:keep-all}
.sub{margin-top:30px;font-size:40px;line-height:1.4;color:#374151;font-weight:600;word-break:keep-all}
.bar{margin-top:44px;width:120px;height:10px;border-radius:5px;background:{{C}}}
.foot{position:absolute;left:110px;bottom:80px;font-size:28px;color:#8a909c;font-weight:600}
</style></head>
<body>
<div class="band"></div><span class="o1"></span><span class="o2"></span><span class="o3"></span>
<div class="num">#{{NO}}</div>
<div class="wrap">
  <span class="chip">{{BOOK}}</span>
  <div class="crumb">{{CRUMB}}</div>
  <h1>{{TITLE}}</h1>
  <div class="sub">{{SUB}}</div>
  <div class="bar"></div>
</div>
<div class="foot">{{SERIES}}</div>
</body></html>
